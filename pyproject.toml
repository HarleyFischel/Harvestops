[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "harvestops"
version = "0.1.0"
description = "Synthetic produce operations portfolio application"
requires-python = ">=3.11,<3.14"
dependencies = [
  "dash==3.1.1",
  "dash-ag-grid==35.3.0",
  "Flask==3.1.3",
  "Flask-Session==0.8.0",
  "gunicorn==23.0.0",
  "plotly==5.24.1",
  "pydantic-settings==2.6.1",
  "pydantic==2.12.5",
  "pyodbc==5.2.0",
  "PyJWT==2.15.0",
  "cryptography==50.0.0",
  "msal==1.39.0",
  "mcp==1.30.0",
  "requests==2.34.2",
  "redis==5.2.1",
  "azure-identity==1.25.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-cov==6.0.0",
  "ruff==0.8.4",
  "playwright==1.49.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/browser"]
addopts = "-q"
markers = ["integration: requires a reachable SQL Server instance"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E702"]

[tool.setuptools.packages.find]
include = ["harvestops*"]
