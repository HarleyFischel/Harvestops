name: Release and deploy
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      environment:
        required: true
        type: environment
permissions:
  contents: read
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Login to ACR with federated Azure identity
        run: az acr login --name "${{ vars.ACR_NAME }}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ vars.ACR_LOGIN_SERVER }}/harvestops:${{ github.sha }},${{ vars.ACR_LOGIN_SERVER }}/harvestops:${{ inputs.version }}
      - name: Update Container App to immutable image digest
        run: az containerapp update --name "${{ vars.CONTAINER_APP_NAME }}" --resource-group "${{ vars.RESOURCE_GROUP }}" --image "${{ vars.ACR_LOGIN_SERVER }}/harvestops@${{ steps.image.outputs.digest }}"
      - name: Smoke check deployed revision
        run: |
          fqdn=$(az containerapp show --name "${{ vars.CONTAINER_APP_NAME }}" --resource-group "${{ vars.RESOURCE_GROUP }}" --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --retry 8 --retry-delay 5 "https://${fqdn}/healthz"
      - name: Promotion reminder
        run: echo "This workflow is manual and environment-scoped; configure GitHub protection rules for production approvals."
