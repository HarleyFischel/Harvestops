name: Release and deploy
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      environment:
        required: true
        type: environment
      image_digest:
        required: false
        type: string
        description: "Existing harvestops image digest (sha256:...) to promote without rebuilding"
permissions:
  contents: read
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Login to ACR for a new image
        if: ${{ inputs.image_digest == '' }}
        run: az acr login --name "${{ vars.ACR_NAME }}"
      - uses: docker/setup-buildx-action@v3
        if: ${{ inputs.image_digest == '' }}
      - uses: docker/build-push-action@v6
        id: image
        if: ${{ inputs.image_digest == '' }}
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ vars.ACR_LOGIN_SERVER }}/harvestops:${{ github.sha }},${{ vars.ACR_LOGIN_SERVER }}/harvestops:${{ inputs.version }}
      - name: Resolve immutable image digest
        id: resolved
        env:
          INPUT_DIGEST: ${{ inputs.image_digest }}
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          digest="${INPUT_DIGEST:-$BUILT_DIGEST}"
          case "$digest" in
            sha256:*) ;;
            *) echo "Expected an immutable sha256 digest" >&2; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Update Container App to immutable image digest
        run: az containerapp update --name "${{ vars.CONTAINER_APP_NAME }}" --resource-group "${{ vars.RESOURCE_GROUP }}" --image "${{ vars.ACR_LOGIN_SERVER }}/harvestops@${{ steps.resolved.outputs.digest }}"
      - name: Smoke check deployed revision
        run: |
          fqdn=$(az containerapp show --name "${{ vars.CONTAINER_APP_NAME }}" --resource-group "${{ vars.RESOURCE_GROUP }}" --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --retry 8 --retry-delay 5 "https://${fqdn}/healthz"
      - name: Promotion reminder
        run: echo "This workflow is manual and environment-scoped; pass the staging digest for production promotion and configure GitHub protection rules."
