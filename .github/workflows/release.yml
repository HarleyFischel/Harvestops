name: Release and deploy
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      environment:
        required: true
        type: environment
permissions:
  contents: read
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: \${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: \${{ vars.AZURE_CLIENT_ID }}
          tenant-id: \${{ vars.AZURE_TENANT_ID }}
          subscription-id: \${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: \${{ vars.ACR_LOGIN_SERVER }}/harvestops:\${{ github.sha }},\${{ vars.ACR_LOGIN_SERVER }}/harvestops:\${{ inputs.version }}
      - name: Smoke check reminder
        run: echo "Production promotion is intentionally manual and environment-scoped."
