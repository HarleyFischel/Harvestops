name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: python -m playwright install --with-deps chromium
      - run: (python -m harvestops.web > /tmp/harvestops.log 2>&1 & echo $! > /tmp/harvestops.pid)
      - run: pytest tests/browser -q
      - run: python -m compileall harvestops
      - run: pip-audit || true
      - run: trufflehog filesystem --directory . --only-verified || true
  build:
    runs-on: ubuntu-latest
    needs: test
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: harvestops:${{ github.sha }}
  sql-integration:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ secrets.SQLSERVER_TEST_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P '${{ secrets.SQLSERVER_TEST_PASSWORD }}' -Q 'SELECT 1'"
          --health-interval 15s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install ODBC Driver 18 and sqlcmd
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
      - run: pip install -e '.[dev]'
      - name: Create integration database
        run: sqlcmd -C -S localhost -U sa -P '${{ secrets.SQLSERVER_TEST_PASSWORD }}' -Q "IF DB_ID(N'HarvestOps') IS NULL CREATE DATABASE HarvestOps"
      - name: Apply T-SQL migrations
        env:
          SQLSERVER_MIGRATION_CONNECTION: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;DATABASE=HarvestOps;UID=sa;PWD=${{ secrets.SQLSERVER_TEST_PASSWORD }};Encrypt=no;TrustServerCertificate=yes;"
        run: python db/run_migrations.py
      - name: Run SQL integration tests
        env:
          SQLSERVER_INTEGRATION_CONNECTION: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;DATABASE=HarvestOps;UID=sa;PWD=${{ secrets.SQLSERVER_TEST_PASSWORD }};Encrypt=no;TrustServerCertificate=yes;"
        run: pytest tests/integration -q
