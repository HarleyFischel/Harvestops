name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: mkdir -p artifacts
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --junitxml=artifacts/pytest.xml
      - run: ./scripts/test-mcp-stdio.sh
      - name: Install Playwright Chromium
        # ubuntu-latest supplies the shared browser libraries; avoid the unbounded
        # apt phase of --with-deps and keep the download explicitly time-bounded.
        run: timeout 180s python -m playwright install chromium
      - run: (python -m harvestops.web > /tmp/harvestops.log 2>&1 & echo $! > /tmp/harvestops.pid)
      - name: Wait for Dash readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8050/healthz; then exit 0; fi
            sleep 1
          done
          cat /tmp/harvestops.log
          exit 1
      - run: pytest tests/browser -q --junitxml=artifacts/browser.xml
      - run: python -m compileall harvestops
      - name: Install dependency audit tool
        run: python -m pip install pip-audit==2.9.0
      - name: Audit third-party Python dependencies
        # Audit the committed third-party lock directly; HarvestOps itself is not
        # published to PyPI, so it is intentionally not an audit target.
        run: pip-audit --strict -r requirements-dev.lock
      - name: Upload structured test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: artifacts/*.xml
          if-no-files-found: warn
          retention-days: 14
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: legacy/package-lock.json
      - run: npm ci --prefix legacy
      - run: npm run build --prefix legacy
      - run: npm audit --prefix legacy --omit=dev --audit-level=high
  secret-scan:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    runs-on: ubuntu-latest
    needs: test
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: harvestops:${{ github.sha }}
  image-scan:
    runs-on: ubuntu-latest
    needs: test
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: harvestops:scan-${{ github.sha }}
      - name: Scan application image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: harvestops:scan-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
  sql-integration:
    if: ${{ vars.SQLSERVER_INTEGRATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      DEMO_MODE: 'true'
      IDENTITY_MODE: demo
      STORAGE_MODE: sqlserver
      SQL_SERVER: localhost,1433
      SQL_DATABASE: HarvestOps
      SQL_USER: sa
      SQL_PASSWORD: ${{ secrets.SQLSERVER_TEST_PASSWORD }}
      SQL_AUTH_MODE: sql_login
      SQL_ENCRYPT: 'false'
      SQL_TRUST_SERVER_CERTIFICATE: 'true'
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ secrets.SQLSERVER_TEST_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/1433'"
          --health-interval 15s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install ODBC Driver 18 and sqlcmd
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - name: Verify SQL login readiness
        run: |
          for attempt in $(seq 1 30); do
            if sqlcmd -C -S "$SQL_SERVER" -U "$SQL_USER" -P "$SQL_PASSWORD" -Q "SELECT 1"; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Create integration database
        run: sqlcmd -C -S "$SQL_SERVER" -U "$SQL_USER" -P "$SQL_PASSWORD" -Q "IF DB_ID(N'HarvestOps') IS NULL CREATE DATABASE HarvestOps"
      - name: Apply T-SQL migrations
        run: python db/run_migrations.py
      - name: Run SQL integration tests
        run: mkdir -p artifacts && pytest tests/integration -q --junitxml=artifacts/sql-integration.xml
      - name: Upload SQL structured test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-test-results-${{ github.sha }}
          path: artifacts/sql-integration.xml
          if-no-files-found: warn
          retention-days: 14
